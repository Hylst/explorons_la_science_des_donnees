<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512" role="img" aria-labelledby="t d">
  <title id="t">Les trois grandes familles du machine learning et les étapes d'un projet</title>
  <desc id="d">Apprentissage supervisé, non supervisé et par renforcement, puis collecte des données, entraînement, évaluation et déploiement du modèle.</desc>
  <rect width="768" height="512" fill="#f8fafc"/>
  <text x="384" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#1e293b">Machine learning</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- Familles -->
    <rect x="30" y="100" width="224" height="170" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="60" y1="225" x2="224" y2="130" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="90" cy="200" r="7" fill="#f59e0b"/><circle cx="130" cy="170" r="7" fill="#1d4ed8"/><circle cx="170" cy="190" r="7" fill="#f59e0b"/><circle cx="200" cy="145" r="7" fill="#1d4ed8"/>
    <text x="142" y="258" font-size="17" font-weight="700" fill="#1e3a8a">Supervisé</text>

    <rect x="272" y="100" width="224" height="170" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="320" cy="150" r="7" fill="#6d28d9"/><circle cx="345" cy="185" r="7" fill="#6d28d9"/><circle cx="335" cy="215" r="7" fill="#6d28d9"/>
    <circle cx="430" cy="140" r="7" fill="#f59e0b"/><circle cx="455" cy="170" r="7" fill="#f59e0b"/><circle cx="420" cy="195" r="7" fill="#f59e0b"/><circle cx="450" cy="220" r="7" fill="#f59e0b"/>
    <text x="384" y="258" font-size="17" font-weight="700" fill="#4c1d95">Non supervisé</text>

    <rect x="514" y="100" width="224" height="170" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <polyline points="545,225 590,205 630,215 680,150 715,130" fill="none" stroke="#047857" stroke-width="3"/>
    <polygon points="715,130 700,133 712,145" fill="#047857"/>
    <circle cx="545" cy="225" r="6" fill="#047857"/><circle cx="590" cy="205" r="6" fill="#047857"/><circle cx="630" cy="215" r="6" fill="#047857"/><circle cx="680" cy="150" r="6" fill="#047857"/>
    <text x="626" y="258" font-size="17" font-weight="700" fill="#065f46">Par renforcement</text>

    <!-- Etapes -->
    <text x="384" y="318" font-size="16" font-weight="700" fill="#475569">Les étapes d'un projet</text>
    <rect x="30" y="338" width="150" height="110" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="105" y="383" font-size="18" font-weight="700" fill="#1e293b">1. Collecte</text><text x="105" y="408" font-size="15" fill="#334155">des données</text>
    <rect x="212" y="338" width="150" height="110" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="287" y="383" font-size="18" font-weight="700" fill="#1e293b">2. Entraîner</text><text x="287" y="408" font-size="15" fill="#334155">le modèle</text>
    <rect x="394" y="338" width="150" height="110" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="469" y="383" font-size="18" font-weight="700" fill="#1e293b">3. Évaluer</text><text x="469" y="408" font-size="15" fill="#334155">le modèle</text>
    <rect x="576" y="338" width="162" height="110" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="657" y="383" font-size="18" font-weight="700" fill="#1e293b">4. Déployer</text><text x="657" y="408" font-size="15" fill="#334155">et surveiller</text>
    <g fill="#475569"><polygon points="182,393 206,393 206,387 218,393 206,399 206,393" transform="translate(-6,0)"/><polygon points="364,393 388,393 388,387 400,393 388,399 388,393" transform="translate(-6,0)"/><polygon points="546,393 570,393 570,387 582,393 570,399 570,393" transform="translate(-6,0)"/></g>
  </g>
</svg>
