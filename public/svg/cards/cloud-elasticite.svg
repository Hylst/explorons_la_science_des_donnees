<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Une capacité qui suit la demande</title>
<desc id="d">La demande horaire simulée du premier module sur une semaine (moyenne 131,6 demandes par heure, pic de 571 lors d'une campagne), une capacité fixe de 12 machines dimensionnée sur ce pic, presque toujours inutilisée, et une capacité élastique qui ajoute ou retire des machines heure par heure.</desc>
