<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Un petit programme Python et sa sortie</title>
<desc id="d">Un éditeur affiche cinq lignes de Python qui calculent une moyenne et affichent les notes au-dessus de la moyenne, puis la sortie du programme.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#2e1065"/></linearGradient></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;white-space:pre}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.k{fill:#c084fc}.n{fill:#e2e8f0}.d{fill:#fbbf24}.s{fill:#86efac}.b{fill:#7dd3fc}.o{fill:#94a3b8}.num{fill:#64748b;font-size:18px}.ln{opacity:1}@keyframes l0{0%{opacity:0}4%{opacity:0;transform:translateX(-12px)}6%{opacity:1;transform:none}92%{opacity:1;transform:none}96%{opacity:0}100%{opacity:0}}.l0{animation:l0 12s ease-out infinite}@keyframes l1{0%{opacity:0}11%{opacity:0;transform:translateX(-12px)}13%{opacity:1;transform:none}92%{opacity:1;transform:none}96%{opacity:0}100%{opacity:0}}.l1{animation:l1 12s ease-out infinite}@keyframes l3{0%{opacity:0}20%{opacity:0;transform:translateX(-12px)}22%{opacity:1;transform:none}92%{opacity:1;transform:none}96%{opacity:0}100%{opacity:0}}.l3{animation:l3 12s ease-out infinite}@keyframes l4{0%{opacity:0}27%{opacity:0;transform:translateX(-12px)}29%{opacity:1;transform:none}92%{opacity:1;transform:none}96%{opacity:0}100%{opacity:0}}.l4{animation:l4 12s ease-out infinite}@keyframes l5{0%{opacity:0}34%{opacity:0;transform:translateX(-12px)}36%{opacity:1;transform:none}92%{opacity:1;transform:none}96%{opacity:0}100%{opacity:0}}.l5{animation:l5 12s ease-out infinite}@keyframes o0{0%{opacity:0}50%{opacity:0}52%{opacity:1}92%{opacity:1}96%{opacity:0}100%{opacity:0}}.o0{animation:o0 12s ease-out infinite}@keyframes o1{0%{opacity:0}58%{opacity:0}60%{opacity:1}92%{opacity:1}96%{opacity:0}100%{opacity:0}}.o1{animation:o1 12s ease-out infinite}@keyframes run{0%{transform:scale(1)}38%{transform:scale(1)}42%{transform:scale(1.35)}46%{transform:scale(1)}100%{transform:scale(1)}}.run{transform-box:fill-box;transform-origin:center;animation:run 12s ease-in-out infinite}</style>
<rect width="800" height="450" fill="url(#bg)"/>
<rect x="60" y="40" width="680" height="370" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/><path d="M60 54a14 14 0 0 1 14-14h652a14 14 0 0 1 14 14v26H60z" fill="#1e293b"/><circle cx="86" cy="60" r="6" fill="#fb7185"/><circle cx="108" cy="60" r="6" fill="#fbbf24"/><circle cx="130" cy="60" r="6" fill="#34d399"/><text x="158" y="66" font-size="16" fill="#cbd5e1">exemple.py</text><polygon class="run" points="706,314 706,334 722,324" fill="#34d399"/><text class="num mono" x="106" y="134" text-anchor="end">1</text><g class="l0"><text class="mono" x="124" y="134" font-size="20" xml:space="preserve"><tspan class="n">notes</tspan><tspan class="o"> = [</tspan><tspan class="d">12</tspan><tspan class="o">, </tspan><tspan class="d">15</tspan><tspan class="o">, </tspan><tspan class="d">9</tspan><tspan class="o">, </tspan><tspan class="d">18</tspan><tspan class="o">]</tspan></text></g><text class="num mono" x="106" y="164" text-anchor="end">2</text><g class="l1"><text class="mono" x="124" y="164" font-size="20" xml:space="preserve"><tspan class="n">moyenne</tspan><tspan class="o"> = </tspan><tspan class="b">sum</tspan><tspan class="o">(</tspan><tspan class="n">notes</tspan><tspan class="o">) / </tspan><tspan class="b">len</tspan><tspan class="o">(</tspan><tspan class="n">notes</tspan><tspan class="o">)</tspan></text></g><text class="num mono" x="106" y="194" text-anchor="end">3</text><text class="num mono" x="106" y="224" text-anchor="end">4</text><g class="l3"><text class="mono" x="124" y="224" font-size="20" xml:space="preserve"><tspan class="k">for</tspan><tspan class="n"> n </tspan><tspan class="k">in</tspan><tspan class="n"> notes</tspan><tspan class="o">:</tspan></text></g><text class="num mono" x="106" y="254" text-anchor="end">5</text><g class="l4"><text class="mono" x="124" y="254" font-size="20" xml:space="preserve"><tspan class="n">    </tspan><tspan class="k">if</tspan><tspan class="n"> n </tspan><tspan class="o">&gt; </tspan><tspan class="n">moyenne</tspan><tspan class="o">:</tspan></text></g><text class="num mono" x="106" y="284" text-anchor="end">6</text><g class="l5"><text class="mono" x="124" y="284" font-size="20" xml:space="preserve"><tspan class="n">        </tspan><tspan class="b">print</tspan><tspan class="o">(</tspan><tspan class="n">n</tspan><tspan class="o">, </tspan><tspan class="s">"au-dessus"</tspan><tspan class="o">)</tspan></text></g><path d="M60 300h680v96a14 14 0 0 1-14 14H74a14 14 0 0 1-14-14z" fill="#111c33"/><text x="90" y="326" font-size="14" fill="#94a3b8" letter-spacing="2">SORTIE</text><g class="o0"><text class="mono" x="90" y="354" font-size="20" fill="#e2e8f0">15 au-dessus</text></g><g class="o1"><text class="mono" x="90" y="382" font-size="20" fill="#e2e8f0">18 au-dessus</text></g>
</svg>
