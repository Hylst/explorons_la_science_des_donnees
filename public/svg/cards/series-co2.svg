<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Concentration de CO2 à Mauna Loa, 1958-2001</title>
<desc id="d">Moyennes mensuelles réelles du CO2 mesuré à Mauna Loa, de 316 ppm en mars 1958 à 371 ppm en décembre 2001 : une tendance qui monte, tracée en jaune, et une oscillation saisonnière chaque année, avec la décomposition série = tendance + saison + reste.</desc>
