<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Les étapes d'un projet de data science</title>
<desc id="d">Quatre étapes reliées par des flèches : données, nettoyage, modèle, évaluation. Un point lumineux passe d'une étape à la suivante.</desc>
