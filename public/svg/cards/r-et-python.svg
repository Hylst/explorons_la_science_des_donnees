<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">La même moyenne par espèce d'iris, écrite en R puis en Python</title>
<desc id="d">À gauche, trois lignes de R avec dplyr regroupent les iris par espèce et calculent la longueur moyenne des sépales. À droite, les trois lignes équivalentes avec pandas apparaissent à leur tour. Une flèche relie les deux versions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;white-space:pre;font-size:16px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes show{0%{opacity:.12}8%,88%{opacity:1}100%{opacity:.12}}
.l1{animation:show 10s ease-in-out infinite}.l2{animation:show 10s ease-in-out .6s infinite}.l3{animation:show 10s ease-in-out 1.2s infinite}
.p1{animation:show 10s ease-in-out 2.6s infinite}.p2{animation:show 10s ease-in-out 3.2s infinite}.p3{animation:show 10s ease-in-out 3.8s infinite}
@keyframes pulse{0%,20%{transform:translateX(0)}30%,90%{transform:translateX(10px)}100%{transform:translateX(0)}}.arrow{animation:pulse 10s ease-in-out 1.8s infinite}</style>
<rect width="800" height="450" fill="url(#bg)"/>
<rect x="30" y="120" width="340" height="190" rx="12" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
<rect x="430" y="120" width="340" height="190" rx="12" fill="#0b1220" stroke="#facc15" stroke-width="2"/>
<text x="50" y="108" fill="#93c5fd" font-size="18" font-weight="600">R (dplyr), à lire</text>
<text x="450" y="108" fill="#fde68a" font-size="18" font-weight="600">Python (pandas), exécuté</text>
<g fill="#e2e8f0">
<text class="mono l1" x="50" y="170">iris |&gt;</text>
<text class="mono l2" x="50" y="210">  group_by(Species) |&gt;</text>
<text class="mono l3" x="50" y="250">  summarise(mean(Sepal.Length))</text>
<text class="mono p1" x="450" y="170">iris.groupby('Species')</text>
<text class="mono p2" x="450" y="210">  ['Sepal.Length']</text>
<text class="mono p3" x="450" y="250">  .mean()</text>
</g>
<g class="arrow" fill="#94a3b8"><path d="M378 215h30v-10l16 15-16 15v-10h-30z"/></g>
<text x="400" y="370" fill="#cbd5e1" font-size="20" text-anchor="middle">même question, même réponse, deux langages</text>
</svg>
