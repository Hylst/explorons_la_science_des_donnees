<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Un graphique en barres avec une courbe de tendance</title>
<desc id="d">Huit barres montent l'une après l'autre, puis une courbe de tendance se dessine par-dessus. Illustration schématique, sans donnée réelle.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#431407"/></linearGradient></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;white-space:pre}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes grow{0%{transform:scaleY(0)}18%{transform:scaleY(1)}84%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s ease-out infinite backwards}@keyframes draw{0%,22%{stroke-dashoffset:1}48%,84%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}.trend{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 9s ease-in-out infinite}@keyframes dots{0%,40%{opacity:0}50%,84%{opacity:1}94%,100%{opacity:0}}.dots{animation:dots 9s linear infinite}</style>
