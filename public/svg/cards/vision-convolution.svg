<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Une convolution sur un chiffre manuscrit</title>
<desc id="d">Un zéro manuscrit réel du jeu de chiffres de scikit-learn, en 8 pixels sur 8 ; une fenêtre de 3 pixels sur 3 le parcourt et chaque position donne une case de la carte de sortie de 6 sur 6, ici la force des contours calculée avec les filtres de Sobel.</desc>
